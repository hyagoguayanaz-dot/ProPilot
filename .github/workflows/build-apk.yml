name: Build APK
on:
  push:
    paths: [ 'mobile/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt update || true
          sudo apt install -y openjdk-17-jdk unzip wget python3-pip python3-setuptools autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev || sudo apt install -y openjdk-17-jdk unzip wget python3-pip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev || true

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 kivy==2.3.0 kivymd==2.0.0 Pillow

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          yes | sdkmanager --licenses 2>&1 | head -20 || echo "sdkmanager not yet installed - will be handled by buildozer"
          # fallback: buildozer will auto-accept via spec flag

      - name: Build APK (debug)
        working-directory: mobile
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProPilot-debug-apk
          path: mobile/bin/*.apk
